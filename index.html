<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-QFRY2FF5P4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-QFRY2FF5P4");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <title>QR Code Generator - Buat QR Code dengan Cepat dan Mudah</title>
  </head>
  <body>
    <button class="back-btn" onclick="goBack()">Multiple</button>
    <div class="qr-container">
      <div class="qr-heading">QR Code Generator</div>
      <section class="user-input">
        <input
          type="text"
          name="input_text"
          id="input_text"
          class="qr-input"
          placeholder="Enter text or URL"
          autocomplete="off"
        />
        <button class="qr-button" type="submit">GENERATE</button>
      </section>
      <div class="qr-code" style="display: none"></div>
      <a
        id="downloadLink"
        class="qr-download"
        style="display: none"
        download="qrcode.png"
        >Download QR Code</a
      >
    </div>
    <button id="About"><img src="img/avatar.png" alt="" /></button>
    <footer class="watermark">© 2026 · QR Code Generator by Raihan</footer>

    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
